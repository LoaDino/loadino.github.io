<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каталог товаров</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>Каталог товаров</h1>

        <div class="filters">
            <label for="product-filter">Показать:</label>
            <select id="product-filter">
                <option value="all">Все товары</option>
                <option value="discount">Уценённые</option>
                <option value="normal">Не уценённые</option>
                <option value="expired">Просроченные</option>
            </select>
        </div>

        <div id="status">Загрузка товаров...</div>
        <div id="updated-at" class="updated-at"></div>
    </header>

    <main id="products" class="products"></main>
</body>
</html>
